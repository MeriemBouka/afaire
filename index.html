<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Afaire</title>
  </head>
  <body>
    <div class="container">
      <!-- Bouton de changement de thème -->
      <button id="theme-button" title="Changer le thème">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
          <path d="M20.71 4.63l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41zM7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3z"/>
        </svg>
      </button>
      
      <h1>Liste des choses à accomplir</h1>

      <!-- Input pour ajouter une nouvelle tâche -->
      <div class="input-wrapper">
        <input id="input-tache" type="text" placeholder="Nouvelle tâche..." />
        <button id="ajouter">Ajouter</button>
      </div>

      <!-- Conteneur pour la liste des tâches -->
      <div id="liste-taches"></div>
    </div>

    <!-- JS -->
    <script type="module" src="main.js"></script>
  </body>
</html>
